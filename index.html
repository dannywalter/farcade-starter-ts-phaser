<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ensure mobile viewport sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Platformer Game</title>
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Farcade SDK (if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #333;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .game-container {
        width: 100%;
        max-width: 500px;
        aspect-ratio: 500/800;
      }
      .game-container canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .game-container,
      canvas {
        user-select: none;
        touch-action: none;
        -webkit-user-select: none;
        -ms-touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="game-container" id="game-container"></div>
    <script>
      // — CONFIGURATION —
      const LEVEL_LENGTH = 10000; // total world width
      const CHUNK_WIDTH = 500; // not used directly but conceptual
      const MIN_PLAT_WIDTH = 100;
      const MAX_PLAT_WIDTH = 200;
      const MIN_GAP = 100;
      const MAX_GAP = 250;
      const DIFFICULTY_SCALE = 5; // chunks over which difficulty ramps

      // — PLAYER CAPABILITIES —
      const PLAYER_MAX_JUMP_DIST = 300;
      const PLAYER_MAX_JUMP_HEIGHT = 170;

      // — NOGGLE TUNING —
      const NOGGLE_MAX_DISTANCE = 300; // max pull‑back distance
      const NOGGLE_MAX_SPEED = 20; // max speed at full pull
      const NOGGLE_GRAVITY = 0.45; // gravity applied to noggles

      // — PALETTES —
      const brightPalettes = {
        "Deep Fried": ["#B9185C", "#D22209", "#C16710", "#D08B11", "#FFE939"],
        "User Gnome": ["#FF1A0B", "#EC5B43", "#FFA21E", "#00A556", "#068940"],
        "Noun 1": ["#D26451", "#F78A18", "#FFC110", "#FF638D", "#CC0595"],
        "Berries & Bubble Gum": ["#834398", "#FF638D", "#FB4694", "#E9265C", "#FF1AD2"],
        "Bold & Bright": ["#F20422", "#FF1AD2", "#FFC110", "#1929F4", "#00FCFF"],
        "Burger Joint": ["#D9391F", "#FF7216", "#F20422", "#FFE939", "#FFB913"],
        Bricks: ["#FFC110", "#EAB118", "#00A556", "#F20422", "#1929F4"],
        "Bold and Vibrant": ["#FF500C", "#9F21A0", "#34AC80", "#FF638D", "#F3322C"],
        Energetic: ["#254EFB", "#F938D8", "#FFEF16", "#FF3A0E", "#D32A09"],
        Playful: ["#FF1AD2", "#FF3A0E", "#FFAE1A", "#2A86FD", "#34AC80"],
        Peyote: ["#27A463", "#018146", "#FDF008", "#FDCEF2", "#F681E6"],
      };
      const dullPalettes = {
        Lumber: ["#6B3F39", "#5A423F", "#7D635E", "#6B3F39", "#D0AEA9"],
        "Cozy Cotton": ["#F9E8DD", "#F9F4E6", "#D7D3CD", "#CFC2AB", "#CBC1BC"],
        "Muted Shades": ["#757576", "#58565C", "#5D6061", "#1F1D29", "#343235"],
        Natural: ["#C5B9A1", "#8F785E", "#9D8E6E", "#CFC2AB", "#9F4B27"],
        "New House": ["#5A423F", "#6E3206", "#7E5243", "#85634F", "#6B3F39"],
        "Subtle Shift": ["#CBC1BC", "#E1D7D5", "#D7D3CD", "#CFC2AB", "#C5B9A1"],
        "Classic UX": ["#343235", "#D7D3CD", "#E5E5DE", "#D8DADF", "#B8CED2"],
        "Light Blend": ["#D5D7E1", "#FDF8FF", "#E5E5DE", "#E1D7D5", "#CFC2AB"],
      };
      let activeBrightPalette, activeDullPalette;

      // — PARALLAX CLOUDS —
      let cloudImg,
        clouds = [];

      // — STATE —
      let joystick = { x: 0, y: 0, outer: 60, inner: 30, activeRadius: 150 };
      let jumpBtn = { x: 0, y: 0, r: 80 };
      let cameraX = 0,
        cameraY = 0,
        initialCameraY = 0;
      let noggles = [],
        things = [],
        score = 0;
      let platforms = [],
        goal,
        levelWidth,
        gameState;
      let nounSpriteSheet,
        noggleImg,
        loadedThingImgs = [],
        loadedThingGrayImgs = [];
      let coyoteTimer = 0,
        jumpBufferTimer = 0;
      const thingImageURLs = [
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-bell-cyoz9Bcp7HxOcemvRfLeI1yApn0BhT.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-beet-RuAHn1SsM80FKaYDMfydcju89SgCMG.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-beer-HJBTuSWKtT2s88THUB3hfJFHyZaNDJ.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-blackhole-1TQp8Ywy1QF9wYZVc4iCgRaSTfgvdW.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-basketball-l64KVTs1jtd0u57ow7uxFrwbBRvQoX.png",
      ];

      // — ANIMATION —
      const FRAME_WIDTH = 48,
        FRAME_HEIGHT = 48;
      const ANIMATION_DEFS = {
        idle: { frames: 16, speed: 8 },
        walk: { frames: 8, speed: 6 },
        jump: { frames: 8, speed: 7 },
        fall: { frames: 8, speed: 7 },
      };
      const ANIMATION_MAP = {
        idle: { right: { row: 4, startFrame: 0 }, left: { row: 6, startFrame: 0 } },
        walk: { right: { row: 0, startFrame: 0 }, left: { row: 2, startFrame: 0 } },
        jump: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
        fall: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
      };

      function preload() {
        nounSpriteSheet = loadImage(
          "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/myNounsSpritesheet_003-ymLtEkBrlNZMQkj37npozrPDdamMbF.png",
        );
        noggleImg = loadImage(
          "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/glasses-square-red-ge40H7EEizX6BtKLM99M270Y9htR9s.png",
        );
        cloudImg = loadImage(
          "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-cloud-i9zXsgKYOqRd5S0VjKaziZYVDtZbmf.png",
        );
        thingImageURLs.forEach((url) => loadedThingImgs.push(loadImage(url)));
      }

      function setup() {
        pixelDensity(window.devicePixelRatio || 1);
        let cnv = createCanvas(500, 800).parent("game-container");
        cnv.elt.removeAttribute("style");
        noSmooth();
        textAlign(CENTER, CENTER);
        imageMode(CENTER);
        colorMode(RGB, 255);

        // build grayscale copies
        loadedThingImgs.forEach((img) => {
          let g = createGraphics(img.width, img.height);
          g.image(img, 0, 0);
          g.filter(GRAY);
          loadedThingGrayImgs.push(g.get());
        });

        initializeGame();
        initialCameraY = player.y - height / 2;
        cameraY = initialCameraY;
        joystick.x = 80;
        joystick.y = height - 80;
        jumpBtn.x = width - 80;
        jumpBtn.y = height - 80;
      }

      function initializeGame() {
        randomSeed(millis());
        // choose palettes
        let dullKeys = Object.keys(dullPalettes),
          brightKeys = Object.keys(brightPalettes);
        activeDullPalette = dullPalettes[dullKeys[floor(random(dullKeys.length))]];
        activeBrightPalette = brightPalettes[brightKeys[floor(random(brightKeys.length))]];

        // reset
        noggles.length = 0;
        score = 0;
        coyoteTimer = 0;
        jumpBufferTimer = 0;

        // player
        player = {
          x: 100,
          y: height - 100,
          width: FRAME_WIDTH,
          height: FRAME_HEIGHT,
          velocityX: 0,
          velocityY: 0,
          isOnGround: false,
          spriteSheet: nounSpriteSheet,
          animation: { currentSet: "idle", facingDirection: 1, frameIndex: 0, tick: 0 },
        };

        // static first platform
        platforms = [
          {
            x: 0,
            y: height - 50,
            w: 400,
            h: 50,
            color: activeDullPalette[floor(random(activeDullPalette.length))],
          },
        ];

        // procedural platforms
        let xPos = 400,
          prevY = height - 50,
          chunkIdx = 0;
        while (xPos < LEVEL_LENGTH) {
          let d = min(chunkIdx / DIFFICULTY_SCALE, 1);
          let gap = lerp(MIN_GAP, MAX_GAP, d);
          xPos += random(gap * 0.8, gap * 1.2);
          let platW = random(MIN_PLAT_WIDTH, lerp(MAX_PLAT_WIDTH, MIN_PLAT_WIDTH, d));
          let vertRange = lerp(PLAYER_MAX_JUMP_HEIGHT * 0.5, PLAYER_MAX_JUMP_HEIGHT, d);
          let newY = constrain(prevY + random(-vertRange, vertRange), 100, height - 150);
          platforms.push({
            x: xPos,
            y: newY,
            w: platW,
            h: 20,
            color: activeDullPalette[floor(random(activeDullPalette.length))],
          });
          prevY = newY;
          xPos += platW;
          chunkIdx++;
        }
        levelWidth = xPos + 500;

        // goal
        goal = {
          x: levelWidth - 200,
          y: random(height / 2, height - 200),
          w: 50,
          h: 50,
          color: activeBrightPalette[floor(random(activeBrightPalette.length))],
        };

        // spawn things
        things = platforms
          .filter((_, i) => i % 3 === 0)
          .map((p, i) => {
            let tx = random(p.x + 10, p.x + p.w - 10);
            return {
              x: tx,
              y: p.y - 32,
              size: 64,
              img: loadedThingImgs[i % loadedThingImgs.length],
              gray: loadedThingGrayImgs[i % loadedThingGrayImgs.length],
              collected: false,
            };
          });

        // clouds
        clouds = Array.from({ length: 20 }, () => {
          return {
            x: random(0, levelWidth),
            y: random(50, height / 2),
            size: random(0.5, 1.5),
            speedFactor: random(0.2, 0.5),
          };
        });

        gameState = "start";
      }

      function draw() {
        background("#63A0F9");
        drawClouds();
        if (gameState === "start") {
          displayStartScreen();
        } else if (gameState === "playing") {
          runGame();
          drawUI();
        } else {
          drawGameScene();
          if (gameState === "gameOver") displayGameOverScreen();
          else displayWinScreen();
        }
      }

      function runGame() {
        handlePlayerInput();
        updatePlayer();
        updatePlayerAnimationState();
        advancePlayerFrame();
        updateCamera();
        drawGameScene();
        updateNoggles();
        checkGoal();
        checkFallen();
      }

      function updateCamera() {
        let tx = player.x - width / 3;
        cameraX = lerp(cameraX, tx, 0.1);
        cameraX = constrain(cameraX, 0, max(levelWidth - width, 0));
        let dy = player.y - height / 2;
        cameraY = min(dy, initialCameraY);
      }

      function drawGameScene() {
        push();
        translate(-cameraX, -cameraY);
        drawPlatforms();
        drawThings();
        drawGoal();
        drawPlayer();
        drawNoggles();
        pop();
      }

      function drawClouds() {
        imageMode(CENTER);
        noTint();
        clouds.forEach((c) => {
          let sx = c.x - cameraX * c.speedFactor;
          image(cloudImg, sx, c.y, cloudImg.width * c.size, cloudImg.height * c.size);
        });
      }

      function drawPlatforms() {
        rectMode(CORNER);
        platforms.forEach((p) => {
          fill(p.color);
          stroke(0, 0, 0, 30);
          strokeWeight(2);
          rect(p.x, p.y, p.w, p.h);
        });
        noStroke();
      }

      function drawThings() {
        imageMode(CENTER);
        things.forEach((t) => {
          image(t.collected ? t.img : t.gray, t.x, t.y, t.size, t.size);
        });
      }

      function drawGoal() {
        rectMode(CORNER);
        fill(goal.color);
        rect(goal.x, goal.y, goal.w, goal.h);
      }

      function drawNoggles() {
        imageMode(CENTER);
        noggles.forEach((n) => {
          push();
          translate(n.x, n.y);
          rotate(n.angle);
          let sz = n.r * 10;
          image(noggleImg, 0, 0, sz, sz);
          pop();
        });
      }

      function updateNoggles() {
        for (let i = noggles.length - 1; i >= 0; i--) {
          let n = noggles[i];
          n.vy += NOGGLE_GRAVITY;
          n.x += n.vx;
          n.y += n.vy;
          n.angle += n.angularVelocity;
          // platform collision
          for (let p of platforms) {
            if (n.x > p.x && n.x < p.x + p.w && n.y > p.y && n.y < p.y + p.h) {
              p.color = activeBrightPalette[floor(random(activeBrightPalette.length))];
              noggles.splice(i, 1);
              break;
            }
          }
          // noun collision
          for (let t of things) {
            if (
              !t.collected &&
              n.x > t.x - t.size / 2 &&
              n.x < t.x + t.size / 2 &&
              n.y > t.y - t.size / 2 &&
              n.y < t.y + t.size / 2
            ) {
              t.collected = true;
              score += 10;
              noggles.splice(i, 1);
              break;
            }
          }
          // out of bounds
          if (n.y > cameraY + height * 2) noggles.splice(i, 1);
        }
      }

      function handlePlayerInput() {
        player.velocityX = 0;
        if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) {
          player.velocityX = -5;
          player.animation.facingDirection = -1;
        }
        if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) {
          player.velocityX = 5;
          player.animation.facingDirection = 1;
        }
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.activeRadius) {
            let dx = constrain(t.x - joystick.x, -(joystick.outer - joystick.inner), joystick.outer - joystick.inner);
            player.velocityX = dx > 0 ? 5 : -5;
            player.animation.facingDirection = dx > 0 ? 1 : -1;
            break;
          }
        }
        for (let t of touches) {
          if (dist(t.x, t.y, jumpBtn.x, jumpBtn.y) < jumpBtn.r) {
            jumpBufferTimer = 6;
            tryPerformJump();
            break;
          }
        }
      }

      function tryPerformJump() {
        if ((player.isOnGround || coyoteTimer > 0) && jumpBufferTimer > 0) {
          player.velocityY = -15;
          player.isOnGround = false;
          coyoteTimer = 0;
          jumpBufferTimer = 0;
        }
      }

      function updatePlayer() {
        // horizontal
        player.x += player.velocityX;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            if (player.velocityX > 0) player.x = p.x - player.width / 2;
            else player.x = p.x + p.w + player.width / 2;
            player.velocityX = 0;
          }
        });
        // timers
        if (!player.isOnGround) coyoteTimer = max(coyoteTimer - 1, 0);
        if (jumpBufferTimer > 0) jumpBufferTimer--;
        if (player.isOnGround && jumpBufferTimer > 0) tryPerformJump();
        // vertical
        player.velocityY += 0.5;
        player.y += player.velocityY;
        player.isOnGround = false;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            let prevBot = player.y - player.velocityY + player.height / 2;
            if (player.velocityY > 0 && prevBot <= p.y + 1) {
              player.y = p.y - player.height / 2;
              player.velocityY = 0;
              player.isOnGround = true;
              coyoteTimer = 6;
            }
          }
        });
        player.x = constrain(player.x, player.width / 2, levelWidth - player.width / 2);
      }

      function updatePlayerAnimationState() {
        let a = player.animation,
          set = a.currentSet;
        if (player.velocityY < -0.1 && !player.isOnGround) set = "jump";
        else if (player.velocityY > 0.1 && !player.isOnGround) set = "fall";
        else if (player.isOnGround && abs(player.velocityX) > 0.1) set = "walk";
        else if (player.isOnGround) set = "idle";
        if (set !== a.currentSet) {
          a.currentSet = set;
          a.frameIndex = 0;
          a.tick = 0;
        }
      }

      function advancePlayerFrame() {
        let a = player.animation,
          d = ANIMATION_DEFS[a.currentSet];
        if (!d) return;
        a.tick++;
        if (a.tick >= d.speed) {
          a.tick = 0;
          a.frameIndex = (a.frameIndex + 1) % d.frames;
        }
      }

      function drawPlayer() {
        if (!player.spriteSheet) {
          push();
          rectMode(CENTER);
          fill(255, 0, 0);
          rect(player.x, player.y, player.width, player.height);
          pop();
          return;
        }
        let a = player.animation,
          dir = a.facingDirection === 1 ? "right" : "left",
          m = ANIMATION_MAP[a.currentSet][dir],
          f = a.frameIndex % ANIMATION_DEFS[a.currentSet].frames,
          sx = (m.startFrame + f) * FRAME_WIDTH,
          sy = m.row * FRAME_HEIGHT,
          dw = FRAME_WIDTH * 3,
          dh = FRAME_HEIGHT * 3,
          yoff = (dh - player.height) / 2,
          dy = player.y - yoff;
        push();
        image(player.spriteSheet, player.x, dy, dw, dh, sx, sy, FRAME_WIDTH, FRAME_HEIGHT);
        pop();
      }

      function drawUI() {
        noFill();
        stroke(0, 0, 100, 50);
        strokeWeight(2);
        circle(joystick.x, joystick.y, joystick.outer * 2);
        let kx = joystick.x;
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.activeRadius) {
            let dx = constrain(t.x - joystick.x, -(joystick.outer - joystick.inner), joystick.outer - joystick.inner);
            kx += dx;
            break;
          }
        }
        noStroke();
        fill(0, 0, 100, 80);
        circle(kx, joystick.y, joystick.inner * 2);
        fill(0, 0, 100, 20);
        circle(jumpBtn.x, jumpBtn.y, jumpBtn.r * 2);
        fill(0, 0, 100, 80);
        textSize(24);
        text("↑", jumpBtn.x, jumpBtn.y + 2);
        noStroke();
        fill(0, 0, 100);
        textSize(24);
        text(`Score: ${score}`, width - 80, 40);
      }

      function isColliding(a, b) {
        let l1 = a.x - a.width / 2,
          r1 = a.x + a.width / 2,
          t1 = a.y - a.height / 2,
          bot1 = a.y + a.height / 2;
        let l2 = b.x,
          r2 = b.x + b.w,
          t2 = b.y,
          bot2 = b.y + b.h;
        return r1 > l2 && l1 < r2 && bot1 > t2 && t1 < bot2;
      }

      function displayStartScreen() {
        fill(0, 0, 100);
        textSize(32);
        text("Noun Platformer Deluxe!", width / 2, height / 3);
        textSize(22);
        text("←→ or A/D: Move", width / 2, height / 2 - 30);
        text("↑/W/Space or Tap Start", width / 2, height / 2 + 10);
      }

      function displayGameOverScreen() {
        fill(0, 0, 0, 60);
        rect(0, 0, width, height);
        fill(0, 100, 100);
        textSize(54);
        text("Game Over", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Restart", width / 2, height / 2 + 40);
      }

      function displayWinScreen() {
        fill(120, 80, 100, 60);
        rect(0, 0, width, height);
        fill(120, 100, 100);
        textSize(60);
        text("You Win!", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Play Again", width / 2, height / 2 + 40);
      }

      function checkGoal() {
        if (isColliding(player, goal)) gameState = "win";
      }

      function checkFallen() {
        if (player.y - player.height / 2 > cameraY + height * 2) gameState = "gameOver";
      }

      function keyPressed() {
        if (gameState === "playing") {
          if ([UP_ARROW, 87, 32].includes(keyCode)) {
            jumpBufferTimer = 6;
            tryPerformJump();
          }
        } else if (keyCode === 32) {
          initializeGame();
          gameState = "playing";
        }
      }

      function mousePressed() {
        if (gameState === "playing") {
          if (
            dist(mouseX, mouseY, joystick.x, joystick.y) > joystick.activeRadius &&
            dist(mouseX, mouseY, jumpBtn.x, jumpBtn.y) > jumpBtn.r
          ) {
            const wsx = player.x,
              wsy = player.y - FRAME_HEIGHT * 1.5,
              wex = cameraX + mouseX,
              wey = cameraY + mouseY,
              dxRaw = wex - wsx,
              dyRaw = wey - wsy,
              distRaw = sqrt(dxRaw * dxRaw + dyRaw * dyRaw),
              eff = min(distRaw, NOGGLE_MAX_DISTANCE),
              speed = (eff / NOGGLE_MAX_DISTANCE) * NOGGLE_MAX_SPEED,
              angle = atan2(dyRaw, dxRaw),
              dx = cos(angle) * speed,
              dy = sin(angle) * speed;
            noggles.push({ x: wsx, y: wsy, vx: dx, vy: dy, r: 10, angle: 0, angularVelocity: random(-0.2, 0.2) });
          }
        } else {
          initializeGame();
          gameState = "playing";
        }
      }

      function touchStarted() {
        if (gameState === "playing") {
          const t = touches[touches.length - 1];
          if (dist(t.x, t.y, jumpBtn.x, jumpBtn.y) <= jumpBtn.r) {
            jumpBufferTimer = 6;
            tryPerformJump();
            return false;
          }
          if (
            dist(t.x, t.y, joystick.x, joystick.y) > joystick.activeRadius &&
            dist(t.x, t.y, jumpBtn.x, jumpBtn.y) > jumpBtn.r
          ) {
            const wsx = player.x,
              wsy = player.y - FRAME_HEIGHT * 1.5,
              wex = cameraX + t.x,
              wey = cameraY + t.y,
              dxRaw = wex - wsx,
              dyRaw = wey - wsy,
              distRaw = sqrt(dxRaw * dxRaw + dyRaw * dyRaw),
              eff = min(distRaw, NOGGLE_MAX_DISTANCE),
              speed = (eff / NOGGLE_MAX_DISTANCE) * NOGGLE_MAX_SPEED,
              angle = atan2(dyRaw, dxRaw),
              dx = cos(angle) * speed,
              dy = sin(angle) * speed;
            noggles.push({ x: wsx, y: wsy, vx: dx, vy: dy, r: 10, angle: 0, angularVelocity: random(-0.2, 0.2) });
          }
          return false;
        } else {
          initializeGame();
          gameState = "playing";
          return false;
        }
      }
    </script>
