<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ensure mobile viewport sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Platformer Game</title>
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Farcade SDK (if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #333;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .game-container {
        width: 100%;
        max-width: 500px;
        aspect-ratio: 500/800;
      }
      .game-container canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="game-container" id="game-container"></div>
    <script>
      // — UI control state —
      let joystick = {
        x: 0,
        y: 0,
        outer: 60, // visual radius
        inner: 30, // knob radius
        activeRadius: 100, // how far off–circle a touch still counts
      };
      let jumpBtn = { x: 0, y: 0, r: 40 };

      // — Camera —
      let cameraX = 0,
        cameraY = 0,
        initialCameraY = 0;

      // — Sprite sheet & player setup —
      const SPRITE_URL =
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/myNounsSpritesheet-OU77yPsOSF8J2NLPWWWFPVya9XMAQS.png";
      const FRAME_WIDTH = 48,
        FRAME_HEIGHT = 48;
      let nounSpriteSheet,
        imageLoadingError = false;

      // — Player & physics —
      let player,
        platforms = [],
        goal,
        levelWidth,
        gameState;
      const PLAYER_MOVE_SPEED = 4;
      const JUMP_FORCE = -11;
      const GRAVITY = 0.5;
      const PLAYER_VISUAL_SCALE = 1.5;

      const ANIMATION_DEFINITIONS = {
        idle: { frames: 16, speed: 8 },
        walk: { frames: 8, speed: 6 },
        jump: { frames: 8, speed: 7 },
        fall: { frames: 8, speed: 7 },
      };

      const ANIMATION_ROW_MAP = {
        idle: { right: { row: 4, startFrame: 0 }, left: { row: 6, startFrame: 0 } },
        walk: { right: { row: 0, startFrame: 0 }, left: { row: 2, startFrame: 0 } },
        jump: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
        fall: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
      };

      function preload() {
        nounSpriteSheet = loadImage(
          SPRITE_URL,
          () => console.log("Sprite sheet loaded"),
          () => {
            console.error("Sprite load failed");
            imageLoadingError = true;
          },
        );
      }

      function setup() {
        const cnv = createCanvas(500, 800).parent("game-container");
        cnv.elt.removeAttribute("style");
        noSmooth();
        colorMode(HSB, 360, 100, 100, 100);
        textAlign(CENTER, CENTER);
        imageMode(CENTER);

        initializeGame();

        // lock initial vertical camera so it only follows up
        initialCameraY = player.y - height / 2;
        cameraY = initialCameraY;

        // position on-screen controls
        joystick.x = 80;
        joystick.y = height - 80;
        jumpBtn.x = width - 80;
        jumpBtn.y = height - 80;
      }

      function initializeGame() {
        player = {
          x: 100,
          y: height - 100,
          width: FRAME_WIDTH,
          height: FRAME_HEIGHT,
          velocityX: 0,
          velocityY: 0,
          isOnGround: false,
          spriteSheet: nounSpriteSheet,
          animation: { currentSet: "idle", facingDirection: 1, frameIndex: 0, tick: 0 },
        };

        platforms = [
          { x: 0, y: height - 50, w: 400, h: 50, color: color(120, 60, 60) },
          { x: 450, y: height - 120, w: 150, h: 20, color: color(120, 60, 70) },
          { x: 650, y: height - 220, w: 200, h: 20, color: color(120, 60, 70) },
          { x: 400, y: height - 320, w: 100, h: 20, color: color(120, 60, 70) },
          { x: 900, y: height - 100, w: 250, h: 100, color: color(120, 60, 65) },
          { x: 1200, y: height - 250, w: 180, h: 20, color: color(120, 60, 70) },
          { x: 1450, y: height - 350, w: 150, h: 20, color: color(120, 60, 70) },
          { x: 1700, y: height - 150, w: 300, h: 150, color: color(120, 60, 60) },
        ];

        goal = { x: 2050, y: height - 100, w: 50, h: 50, color: color(50, 100, 100) };
        platforms.push({
          x: goal.x - 25,
          y: goal.y + goal.h - 20,
          w: 100,
          h: 20,
          color: color(120, 60, 60),
        });

        levelWidth = Math.max(...platforms.map((p) => p.x + p.w), goal.x + goal.w) + 200;
        gameState = "start";
      }

      function draw() {
        background(195, 70, 40);
        if (imageLoadingError && gameState !== "gameOver") {
          fill(0, 0, 100);
          textSize(18);
          text("Error loading spritesheet.\nCheck console.", width / 2, height / 2);
          return;
        }

        if (gameState === "start") {
          displayStartScreen();
        } else if (gameState === "playing") {
          runGame();
          drawUI();
        } else {
          drawGameScene();
          if (gameState === "gameOver") displayGameOverScreen();
          else displayWinScreen();
        }
      }

      function runGame() {
        handlePlayerInput();
        updatePlayer();
        updatePlayerAnimationState();
        advancePlayerFrame();
        updateCamera();
        drawGameScene();
        checkGoal();
        checkFallen();
      }

      function updateCamera() {
        // horizontal follow
        let targetX = player.x - width / 3;
        cameraX = lerp(cameraX, targetX, 0.1);
        cameraX = constrain(cameraX, 0, max(levelWidth - width, 0));

        // vertical: follow up only
        let desiredY = player.y - height / 2;
        cameraY = min(desiredY, initialCameraY);
      }

      function drawGameScene() {
        push();
        translate(-cameraX, -cameraY);
        drawPlatforms();
        drawGoal();
        drawPlayer();
        pop();
      }

      function handlePlayerInput() {
        // keyboard
        player.velocityX = 0;
        if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) {
          player.velocityX = -PLAYER_MOVE_SPEED;
          player.animation.facingDirection = -1;
        }
        if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) {
          player.velocityX = PLAYER_MOVE_SPEED;
          player.animation.facingDirection = 1;
        }
        // joystick (touch)
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.outer) {
            let dx = t.x - joystick.x;
            if (abs(dx) > joystick.inner) {
              player.velocityX = dx > 0 ? PLAYER_MOVE_SPEED : -PLAYER_MOVE_SPEED;
              player.animation.facingDirection = dx > 0 ? 1 : -1;
            }
            break;
          }
        }
        // jump button (touch)
        for (let t of touches) {
          if (dist(t.x, t.y, jumpBtn.x, jumpBtn.y) < jumpBtn.r) {
            playerJump();
            break;
          }
        }
      }

      function playerJump() {
        if (player.isOnGround) {
          player.velocityY = JUMP_FORCE;
          player.isOnGround = false;
        }
      }

      function updatePlayer() {
        // horizontal
        player.x += player.velocityX;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            if (player.velocityX > 0) player.x = p.x - player.width / 2;
            else player.x = p.x + p.w + player.width / 2;
            player.velocityX = 0;
          }
        });
        // vertical
        player.velocityY += GRAVITY;
        player.y += player.velocityY;
        player.isOnGround = false;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            let prevB = player.y - player.velocityY + player.height / 2,
              topY = p.y;
            if (player.velocityY > 0 && prevB <= topY + 1) {
              player.y = topY - player.height / 2;
              player.velocityY = 0;
              player.isOnGround = true;
            } else if (player.velocityY < 0) {
              let prevT = player.y - player.velocityY - player.height / 2,
                botY = p.y + p.h;
              if (prevT >= botY - 1) {
                player.y = botY + player.height / 2;
                player.velocityY = 0;
              }
            }
          }
        });
        // bounds
        player.x = constrain(player.x, player.width / 2, levelWidth - player.width / 2);
      }

      function updatePlayerAnimationState() {
        let a = player.animation,
          set = a.currentSet;
        if (player.velocityY < -0.1 && !player.isOnGround) set = "jump";
        else if (player.velocityY > 0.1 && !player.isOnGround) set = "fall";
        else if (player.isOnGround) set = abs(player.velocityX) > 0.1 ? "walk" : "idle";
        if (set !== a.currentSet) {
          a.currentSet = set;
          a.frameIndex = 0;
          a.tick = 0;
        }
      }

      function advancePlayerFrame() {
        let a = player.animation,
          d = ANIMATION_DEFINITIONS[a.currentSet];
        if (!d) return;
        a.tick++;
        if (a.tick >= d.speed) {
          a.tick = 0;
          a.frameIndex = (a.frameIndex + 1) % d.frames;
        }
      }

      function drawUI() {
        // joystick
        noFill();
        stroke(0, 0, 100, 50);
        strokeWeight(2);
        circle(joystick.x, joystick.y, joystick.outer * 2);
        let kx = joystick.x;
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.outer) {
            let dx = constrain(t.x - joystick.x, -joystick.outer + joystick.inner, joystick.outer - joystick.inner);
            kx += dx;
            break;
          }
        }
        noStroke();
        fill(0, 0, 100, 80);
        circle(kx, joystick.y, joystick.inner * 2);

        // jump button
        fill(0, 0, 100, 20);
        circle(jumpBtn.x, jumpBtn.y, jumpBtn.r * 2);
        fill(0, 0, 100, 80);
        textSize(24);
        text("↑", jumpBtn.x, jumpBtn.y + 2);
      }

      function drawPlatforms() {
        rectMode(CORNER);
        platforms.forEach((p) => {
          fill(p.color);
          stroke(0, 0, 0, 30);
          strokeWeight(2);
          rect(p.x, p.y, p.w, p.h);
        });
        noStroke();
      }

      function drawGoal() {
        rectMode(CORNER);
        fill(goal.color);
        rect(goal.x, goal.y, goal.w, goal.h);
      }

      function drawPlayer() {
        if (!player.spriteSheet || imageLoadingError) {
          push();
          rectMode(CENTER);
          fill(255, 0, 0);
          rect(player.x, player.y, player.width, player.height);
          pop();
          return;
        }
        let a = player.animation,
          dir = a.facingDirection === 1 ? "right" : "left",
          m = ANIMATION_ROW_MAP[a.currentSet][dir],
          f = a.frameIndex % ANIMATION_DEFINITIONS[a.currentSet].frames,
          sx = (m.startFrame + f) * FRAME_WIDTH,
          sy = m.row * FRAME_HEIGHT,
          dw = FRAME_WIDTH * PLAYER_VISUAL_SCALE,
          dh = FRAME_HEIGHT * PLAYER_VISUAL_SCALE,
          yoff = (dh - player.height) / 2,
          dy = player.y - yoff;
        push();
        image(player.spriteSheet, player.x, dy, dw, dh, sx, sy, FRAME_WIDTH, FRAME_HEIGHT);
        pop();
      }

      function isColliding(a, b) {
        let l1 = a.x - a.width / 2,
          r1 = a.x + a.width / 2,
          t1 = a.y - a.height / 2,
          bot1 = a.y + a.height / 2;
        let l2 = b.x,
          r2 = b.x + b.w,
          t2 = b.y,
          bot2 = b.y + b.h;
        return r1 > l2 && l1 < r2 && bot1 > t2 && t1 < bot2;
      }

      function displayStartScreen() {
        fill(0, 0, 100);
        textSize(32);
        text("Noun Platformer Deluxe!", width / 2, height / 3);
        textSize(22);
        text("←→ or A/D: Move", width / 2, height / 2 - 30);
        text("↑/W/Space or Tap Start", width / 2, height / 2 + 10);
      }

      function displayGameOverScreen() {
        fill(0, 0, 0, 60);
        rect(0, 0, width, height);
        fill(0, 100, 100);
        textSize(54);
        text("Game Over", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Restart", width / 2, height / 2 + 40);
      }

      function displayWinScreen() {
        fill(120, 80, 100, 60);
        rect(0, 0, width, height);
        fill(120, 100, 100);
        textSize(60);
        text("You Win!", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Play Again", width / 2, height / 2 + 40);
      }

      function checkGoal() {
        if (isColliding(player, goal)) {
          gameState = "win";
        }
      }

      // Fall threshold multiplier (2× the screen height)
      const FALL_OFFSCREEN_MULTIPLIER = 1.5;

      function checkFallen() {
        // world‑Y of the player's bottom:
        const playerBottomY = player.y + player.height / 2;
        // viewport bottom in world‑Y, extended by multiplier:
        const fallLimitY = cameraY + height * FALL_OFFSCREEN_MULTIPLIER;

        if (playerBottomY > fallLimitY) {
          gameState = "gameOver";
        }
      }

      function keyPressed() {
        if (gameState === "playing") {
          if ([UP_ARROW, 87, 32].includes(keyCode)) playerJump();
        } else if (keyCode === 32) {
          initializeGame();
          gameState = "playing";
        }
      }

      function mousePressed() {
        if (gameState !== "playing") {
          initializeGame();
          gameState = "playing";
        }
      }

      function touchStarted() {
        if (gameState !== "playing") {
          initializeGame();
          gameState = "playing";
          return false;
        }
      }
    </script>
  </body>
</html>
