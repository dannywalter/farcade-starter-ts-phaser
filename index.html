<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ensure mobile viewport sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Platformer Game</title>
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Farcade SDK (if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #333;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .game-container {
        width: 100%;
        max-width: 500px;
        aspect-ratio: 500/800;
      }
      .game-container canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .game-container,
      canvas {
        user-select: none;
        touch-action: none;
        -webkit-user-select: none;
        -ms-touch-action: none;
      }
    </style>
  </head>
  <body>
    <div class="game-container" id="game-container"></div>
    <script>
      // — Palette definitions —
      const brightPalettes = {
        "Deep Fried": ["#B9185C", "#D22209", "#C16710", "#D08B11", "#FFE939"],
        "User Gnome": ["#FF1A0B", "#EC5B43", "#FFA21E", "#00A556", "#068940"],
        "Noun 1": ["#D26451", "#F78A18", "#FFC110", "#FF638D", "#CC0595"],
        "Berries & Bubble Gum": ["#834398", "#FF638D", "#FB4694", "#E9265C", "#FF1AD2"],
        "Bold & Bright": ["#F20422", "#FF1AD2", "#FFC110", "#1929F4", "#00FCFF"],
        "Burger Joint": ["#D9391F", "#FF7216", "#F20422", "#FFE939", "#FFB913"],
        Bricks: ["#FFC110", "#EAB118", "#00A556", "#F20422", "#1929F4"],
        "Bold and Vibrant": ["#FF500C", "#9F21A0", "#34AC80", "#FF638D", "#F3322C"],
        Energetic: ["#254EFB", "#F938D8", "#FFEF16", "#FF3A0E", "#D32A09"],
        Playful: ["#FF1AD2", "#FF3A0E", "#FFAE1A", "#2A86FD", "#34AC80"],
        Peyote: ["#27A463", "#018146", "#FDF008", "#FDCEF2", "#F681E6"],
      };
      const dullPalettes = {
        Lumber: ["#6B3F39", "#5A423F", "#7D635E", "#6B3F39", "#D0AEA9"],
        "Cozy Cotton": ["#F9E8DD", "#F9F4E6", "#D7D3CD", "#CFC2AB", "#CBC1BC"],
        "Muted Shades": ["#757576", "#58565C", "#5D6061", "#1F1D29", "#343235"],
        Natural: ["#C5B9A1", "#8F785E", "#9D8E6E", "#CFC2AB", "#9F4B27"],
        "New House": ["#5A423F", "#6E3206", "#7E5243", "#85634F", "#6B3F39"],
        "Subtle Shift": ["#CBC1BC", "#E1D7D5", "#D7D3CD", "#CFC2AB", "#C5B9A1"],
        "Classic UX": ["#343235", "#D7D3CD", "#E5E5DE", "#D8DADF", "#B8CED2"],
        "Light Blend": ["#D5D7E1", "#FDF8FF", "#E5E5DE", "#E1D7D5", "#CFC2AB"],
      };
      let activeBrightPalette, activeDullPalette;
      function choosePalettes() {
        const dullKeys = Object.keys(dullPalettes);
        const brightKeys = Object.keys(brightPalettes);
        activeDullPalette = dullPalettes[dullKeys[Math.floor(Math.random() * dullKeys.length)]];
        activeBrightPalette = brightPalettes[brightKeys[Math.floor(Math.random() * brightKeys.length)]];
      }

      // — Parallax clouds —
      let cloudImg;
      let clouds = [];
      function drawClouds() {
        if (!cloudImg) return;
        imageMode(CENTER);
        noTint();
        for (let c of clouds) {
          const screenX = c.x - cameraX * c.speedFactor;
          image(cloudImg, screenX, c.y, cloudImg.width * c.size, cloudImg.height * c.size);
        }
      }

      // — UI control state —
      let joystick = { x: 0, y: 0, outer: 60, inner: 30, activeRadius: 150 };
      let jumpBtn = { x: 0, y: 0, r: 40 };

      // — Camera —
      let cameraX = 0,
        cameraY = 0,
        initialCameraY = 0;

      // — Projectile (noggle) state —
      let noggles = [];
      const MAX_THROW_DISTANCE = 200;
      const MAX_THROW_SPEED = 15;
      const GRAVITY = 0.5;

      // — Colorable objects (“nouns”) —
      let things = [],
        score = 0;
      const thingImageURLs = [
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-bell-cyoz9Bcp7HxOcemvRfLeI1yApn0BhT.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-beet-RuAHn1SsM80FKaYDMfydcju89SgCMG.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-beer-HJBTuSWKtT2s88THUB3hfJFHyZaNDJ.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-blackhole-1TQp8Ywy1QF9wYZVc4iCgRaSTfgvdW.png",
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-basketball-l64KVTs1jtd0u57ow7uxFrwbBRvQoX.png",
      ];
      let loadedThingImgs = [],
        loadedThingGrayImgs = [];

      // — Noggle image & spin —
      let noggleImg;

      // — Sprite sheet & player setup —
      const SPRITE_URL =
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/myNounsSpritesheet_003-ymLtEkBrlNZMQkj37npozrPDdamMbF.png";
      const FRAME_WIDTH = 48,
        FRAME_HEIGHT = 48;
      let nounSpriteSheet,
        imageLoadingError = false;

      // — Player & physics —
      let player,
        platforms = [],
        goal,
        levelWidth,
        gameState;
      const PLAYER_MOVE_SPEED = 5;
      const JUMP_FORCE = -15;
      const COYOTE_FRAMES = 6;
      const JUMP_BUFFER_FRAMES = 6;
      let coyoteTimer = 0,
        jumpBufferTimer = 0;

      const ANIMATION_DEFINITIONS = {
        idle: { frames: 16, speed: 8 },
        walk: { frames: 8, speed: 6 },
        jump: { frames: 8, speed: 7 },
        fall: { frames: 8, speed: 7 },
      };
      const ANIMATION_ROW_MAP = {
        idle: { right: { row: 4, startFrame: 0 }, left: { row: 6, startFrame: 0 } },
        walk: { right: { row: 0, startFrame: 0 }, left: { row: 2, startFrame: 0 } },
        jump: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
        fall: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
      };

      function preload() {
        nounSpriteSheet = loadImage(
          SPRITE_URL,
          () => console.log("Sprite sheet loaded"),
          () => {
            console.error("Sprite load failed");
            imageLoadingError = true;
          },
        );
        noggleImg = loadImage(
          "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/glasses-square-red-ge40H7EEizX6BtKLM99M270Y9htR9s.png",
        );
        for (let url of thingImageURLs) {
          loadedThingImgs.push(loadImage(url));
        }
        cloudImg = loadImage(
          "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/head-cloud-i9zXsgKYOqRd5S0VjKaziZYVDtZbmf.png",
        );
      }

      function setup() {
        pixelDensity(window.devicePixelRatio || 1);
        const cnv = createCanvas(500, 800).parent("game-container");
        cnv.elt.removeAttribute("style");
        noSmooth();
        colorMode(RGB, 255);
        textAlign(CENTER, CENTER);
        imageMode(CENTER);

        // build grayscale copies
        for (let img of loadedThingImgs) {
          let g = createGraphics(img.width, img.height);
          g.image(img, 0, 0);
          g.filter(GRAY);
          loadedThingGrayImgs.push(g.get());
        }

        initializeGame();
        initialCameraY = player.y - height / 2;
        cameraY = initialCameraY;
        joystick.x = 80;
        joystick.y = height - 80;
        jumpBtn.x = width - 80;
        jumpBtn.y = height - 80;
      }

      function initializeGame() {
        choosePalettes();

        noggles.length = 0;
        coyoteTimer = 0;
        jumpBufferTimer = 0;
        score = 0;

        player = {
          x: 100,
          y: height - 100,
          width: FRAME_WIDTH,
          height: FRAME_HEIGHT,
          velocityX: 0,
          velocityY: 0,
          isOnGround: false,
          spriteSheet: nounSpriteSheet,
          animation: { currentSet: "idle", facingDirection: 1, frameIndex: 0, tick: 0 },
        };

        // build platforms with dull palette
        platforms = [
          { x: 0, y: height - 50, w: 400, h: 50 },
          { x: 300, y: height - 250, w: 150, h: 20 },
          { x: 650, y: height - 350, w: 120, h: 20 },
          { x: 1000, y: height - 250, w: 140, h: 20 },
          { x: 1350, y: height - 400, w: 100, h: 20 },
          { x: 1700, y: height - 300, w: 180, h: 20 },
          { x: 2050, y: height - 280, w: 110, h: 20 },
          { x: 2300, y: height - 240, w: 90, h: 20 },
          { x: 2550, y: height - 300, w: 130, h: 20 },
          { x: 2800, y: height - 180, w: 200, h: 20 },
          { x: 3100, y: height - 230, w: 100, h: 20 },
          { x: 3275, y: height - 290, w: 100, h: 20 },
          { x: 3450, y: height - 350, w: 100, h: 20 },
          { x: 3700, y: height - 150, w: 600, h: 20 },
        ].map((p) => ({
          ...p,
          color: activeDullPalette[Math.floor(Math.random() * activeDullPalette.length)],
        }));

        // goal with bright palette
        goal = {
          x: 4400,
          y: height - 200,
          w: 50,
          h: 50,
          color: activeBrightPalette[Math.floor(Math.random() * activeBrightPalette.length)],
        };

        platforms.push({
          x: goal.x - 25,
          y: goal.y + goal.h - 20,
          w: 100,
          h: 20,
          color: activeDullPalette[Math.floor(Math.random() * activeDullPalette.length)],
        });

        // place “nouns”
        const thingXs = [500, 1200, 2000, 2800, 3600];
        things = thingXs.map((x, i) => ({
          x,
          y: height - 250,
          size: 64,
          img: loadedThingImgs[i],
          gray: loadedThingGrayImgs[i],
          collected: false,
        }));

        // level width
        levelWidth = Math.max(...platforms.map((p) => p.x + p.w), goal.x + goal.w) + 200;

        // generate clouds
        clouds = [];
        for (let i = 0; i < 20; i++) {
          clouds.push({
            x: random(0, levelWidth),
            y: random(50, height / 2),
            size: random(0.5, 1.5),
            speedFactor: random(0.2, 0.5),
          });
        }

        gameState = "start";
      }

      function draw() {
        // sky background
        background("#63A0F9");

        // draw parallax clouds
        drawClouds();

        if (imageLoadingError && gameState !== "gameOver") {
          fill(0);
          textSize(18);
          text("Error loading spritesheet.\nCheck console.", width / 2, height / 2);
          return;
        }

        if (gameState === "start") {
          displayStartScreen();
        } else if (gameState === "playing") {
          runGame();
          drawUI();
        } else {
          drawGameScene();
          if (gameState === "gameOver") displayGameOverScreen();
          else displayWinScreen();
        }
      }

      function runGame() {
        handlePlayerInput();
        updatePlayer();
        updatePlayerAnimationState();
        advancePlayerFrame();
        updateCamera();
        drawGameScene();
        updateNoggles();
        checkGoal();
        checkFallen();
      }

      function updateCamera() {
        let tx = player.x - width / 3;
        cameraX = lerp(cameraX, tx, 0.1);
        cameraX = constrain(cameraX, 0, max(levelWidth - width, 0));
        let dy = player.y - height / 2;
        cameraY = min(dy, initialCameraY);
      }

      function drawGameScene() {
        push();
        translate(-cameraX, -cameraY);
        drawPlatforms();
        drawThings();
        drawGoal();
        drawPlayer();
        drawNoggles();
        pop();
      }

      function drawPlatforms() {
        rectMode(CORNER);
        platforms.forEach((p) => {
          fill(p.color);
          stroke(0, 0, 0, 30);
          strokeWeight(2);
          rect(p.x, p.y, p.w, p.h);
        });
        noStroke();
      }

      function drawGoal() {
        rectMode(CORNER);
        fill(goal.color);
        rect(goal.x, goal.y, goal.w, goal.h);
      }

      function drawThings() {
        imageMode(CENTER);
        for (let t of things) {
          image(t.collected ? t.img : t.gray, t.x, t.y, t.size, t.size);
        }
      }

      function updateNoggles() {
        for (let i = noggles.length - 1; i >= 0; i--) {
          let n = noggles[i];
          n.vy += GRAVITY;
          n.x += n.vx;
          n.y += n.vy;
          n.angle += n.angularVelocity;

          // platform collisions
          for (let p of platforms) {
            if (n.x > p.x && n.x < p.x + p.w && n.y > p.y && n.y < p.y + p.h) {
              p.color = activeBrightPalette[Math.floor(Math.random() * activeBrightPalette.length)];
              noggles.splice(i, 1);
              break;
            }
          }
          // noun collisions
          for (let t of things) {
            if (
              !t.collected &&
              n.x > t.x - t.size / 2 &&
              n.x < t.x + t.size / 2 &&
              n.y > t.y - t.size / 2 &&
              n.y < t.y + t.size / 2
            ) {
              t.collected = true;
              score += 10;
              noggles.splice(i, 1);
              break;
            }
          }
          // out of bounds
          if (n.y > cameraY + height * 2) noggles.splice(i, 1);
        }
      }

      function drawNoggles() {
        imageMode(CENTER);
        for (let n of noggles) {
          push();
          translate(n.x, n.y);
          rotate(n.angle);
          let size = n.r * 10;
          image(noggleImg, 0, 0, size, size);
          pop();
        }
      }

      function handlePlayerInput() {
        player.velocityX = 0;
        if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) {
          player.velocityX = -PLAYER_MOVE_SPEED;
          player.animation.facingDirection = -1;
        }
        if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) {
          player.velocityX = PLAYER_MOVE_SPEED;
          player.animation.facingDirection = 1;
        }
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.activeRadius) {
            let dx = constrain(t.x - joystick.x, -(joystick.outer - joystick.inner), joystick.outer - joystick.inner);
            player.velocityX = dx > 0 ? PLAYER_MOVE_SPEED : -PLAYER_MOVE_SPEED;
            player.animation.facingDirection = dx > 0 ? 1 : -1;
            break;
          }
        }
        for (let t of touches) {
          if (dist(t.x, t.y, jumpBtn.x, jumpBtn.y) < jumpBtn.r) {
            jumpBufferTimer = JUMP_BUFFER_FRAMES;
            tryPerformJump();
            break;
          }
        }
      }

      function tryPerformJump() {
        if ((player.isOnGround || coyoteTimer > 0) && jumpBufferTimer > 0) {
          player.velocityY = JUMP_FORCE;
          player.isOnGround = false;
          coyoteTimer = 0;
          jumpBufferTimer = 0;
        }
      }

      function updatePlayer() {
        player.x += player.velocityX;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            if (player.velocityX > 0) player.x = p.x - player.width / 2;
            else player.x = p.x + p.w + player.width / 2;
            player.velocityX = 0;
          }
        });
        if (!player.isOnGround) coyoteTimer = max(coyoteTimer - 1, 0);
        if (jumpBufferTimer > 0) jumpBufferTimer--;
        if (player.isOnGround && jumpBufferTimer > 0) tryPerformJump();
        player.velocityY += GRAVITY;
        player.y += player.velocityY;
        player.isOnGround = false;
        platforms.forEach((p) => {
          if (isColliding(player, p)) {
            let prevB = player.y - player.velocityY + player.height / 2;
            let topY = p.y;
            if (player.velocityY > 0 && prevB <= topY + 1) {
              player.y = topY - player.height / 2;
              player.velocityY = 0;
              player.isOnGround = true;
              coyoteTimer = COYOTE_FRAMES;
            } else if (player.velocityY < 0) {
              let prevT = player.y - player.velocityY - player.height / 2;
              let botY = p.y + p.h;
              if (prevT >= botY - 1) {
                player.y = botY + player.height / 2;
                player.velocityY = 0;
              }
            }
          }
        });
        player.x = constrain(player.x, player.width / 2, levelWidth - player.width / 2);
      }

      function updatePlayerAnimationState() {
        let a = player.animation,
          set = a.currentSet;
        if (player.velocityY < -0.1 && !player.isOnGround) set = "jump";
        else if (player.velocityY > 0.1 && !player.isOnGround) set = "fall";
        else if (player.isOnGround && abs(player.velocityX) > 0.1) set = "walk";
        else if (player.isOnGround) set = "idle";
        if (set !== a.currentSet) {
          a.currentSet = set;
          a.frameIndex = 0;
          a.tick = 0;
        }
      }

      function advancePlayerFrame() {
        let a = player.animation,
          d = ANIMATION_DEFINITIONS[a.currentSet];
        if (!d) return;
        a.tick++;
        if (a.tick >= d.speed) {
          a.tick = 0;
          a.frameIndex = (a.frameIndex + 1) % d.frames;
        }
      }

      function drawPlayer() {
        if (!player.spriteSheet || imageLoadingError) {
          push();
          rectMode(CENTER);
          fill(255, 0, 0);
          rect(player.x, player.y, player.width, player.height);
          pop();
          return;
        }
        let a = player.animation,
          dir = a.facingDirection === 1 ? "right" : "left",
          m = ANIMATION_ROW_MAP[a.currentSet][dir],
          f = a.frameIndex % ANIMATION_DEFINITIONS[a.currentSet].frames,
          sx = (m.startFrame + f) * FRAME_WIDTH,
          sy = m.row * FRAME_HEIGHT,
          dw = FRAME_WIDTH * 3,
          dh = FRAME_HEIGHT * 3,
          yoff = (dh - player.height) / 2,
          dy = player.y - yoff;
        push();
        image(player.spriteSheet, player.x, dy, dw, dh, sx, sy, FRAME_WIDTH, FRAME_HEIGHT);
        pop();
      }

      function drawUI() {
        noFill();
        stroke(0, 0, 100, 50);
        strokeWeight(2);
        circle(joystick.x, joystick.y, joystick.outer * 2);
        let kx = joystick.x;
        for (let t of touches) {
          if (dist(t.x, t.y, joystick.x, joystick.y) < joystick.activeRadius) {
            let dx = constrain(t.x - joystick.x, -(joystick.outer - joystick.inner), joystick.outer - joystick.inner);
            kx += dx;
            break;
          }
        }
        noStroke();
        fill(0, 0, 100, 80);
        circle(kx, joystick.y, joystick.inner * 2);

        fill(0, 0, 100, 20);
        circle(jumpBtn.x, jumpBtn.y, jumpBtn.r * 2);
        fill(0, 0, 100, 80);
        textSize(24);
        text("↑", jumpBtn.x, jumpBtn.y + 2);

        noStroke();
        fill(0, 0, 100);
        textSize(24);
        text(`Score: ${score}`, width - 80, 40);
      }

      function isColliding(a, b) {
        let l1 = a.x - a.width / 2,
          r1 = a.x + a.width / 2,
          t1 = a.y - a.height / 2,
          bot1 = a.y + a.height / 2;
        let l2 = b.x,
          r2 = b.x + b.w,
          t2 = b.y,
          bot2 = b.y + b.h;
        return r1 > l2 && l1 < r2 && bot1 > t2 && t1 < bot2;
      }

      function displayStartScreen() {
        fill(0, 0, 100);
        textSize(32);
        text("Noun Platformer Deluxe!", width / 2, height / 3);
        textSize(22);
        text("←→ or A/D: Move", width / 2, height / 2 - 30);
        text("↑/W/Space or Tap Start", width / 2, height / 2 + 10);
      }

      function displayGameOverScreen() {
        fill(0, 0, 0, 60);
        rect(0, 0, width, height);
        fill(0, 100, 100);
        textSize(54);
        text("Game Over", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Restart", width / 2, height / 2 + 40);
      }

      function displayWinScreen() {
        fill(120, 80, 100, 60);
        rect(0, 0, width, height);
        fill(120, 100, 100);
        textSize(60);
        text("You Win!", width / 2, height / 3);
        textSize(30);
        text("Tap Space to Play Again", width / 2, height / 2 + 40);
      }

      function checkGoal() {
        if (isColliding(player, goal)) gameState = "win";
      }
      function checkFallen() {
        if (player.y - player.height / 2 > cameraY + height * 2) gameState = "gameOver";
      }

      function keyPressed() {
        if (gameState === "playing") {
          if ([UP_ARROW, 87, 32].includes(keyCode)) {
            jumpBufferTimer = JUMP_BUFFER_FRAMES;
            tryPerformJump();
          }
        } else if (keyCode === 32) {
          initializeGame();
          gameState = "playing";
        }
      }

      function mousePressed() {
        if (gameState === "playing") {
          if (
            dist(mouseX, mouseY, joystick.x, joystick.y) > joystick.activeRadius &&
            dist(mouseX, mouseY, jumpBtn.x, jumpBtn.y) > jumpBtn.r
          ) {
            const wsx = player.x,
              wsy = player.y - (FRAME_HEIGHT * 3) / 2,
              wex = cameraX + mouseX,
              wey = cameraY + mouseY,
              dxRaw = wex - wsx,
              dyRaw = wey - wsy,
              distRaw = sqrt(dxRaw * dxRaw + dyRaw * dyRaw),
              eff = min(distRaw, MAX_THROW_DISTANCE),
              speed = (eff / MAX_THROW_DISTANCE) * MAX_THROW_SPEED,
              angle = atan2(dyRaw, dxRaw),
              dx = cos(angle) * speed,
              dy = sin(angle) * speed;
            noggles.push({ x: wsx, y: wsy, vx: dx, vy: dy, r: 10, angle: 0, angularVelocity: random(-0.2, 0.2) });
          }
        } else {
          initializeGame();
          gameState = "playing";
        }
      }

      function touchStarted() {
        if (gameState === "playing") {
          const t = touches[touches.length - 1];
          if (dist(t.x, t.y, jumpBtn.x, jumpBtn.y) <= jumpBtn.r) {
            jumpBufferTimer = JUMP_BUFFER_FRAMES;
            tryPerformJump();
            return false;
          }
          if (
            dist(t.x, t.y, joystick.x, joystick.y) > joystick.activeRadius &&
            dist(t.x, t.y, jumpBtn.x, jumpBtn.y) > jumpBtn.r
          ) {
            const wsx = player.x,
              wsy = player.y - (FRAME_HEIGHT * 3) / 2,
              wex = cameraX + t.x,
              wey = cameraY + t.y,
              dxRaw = wex - wsx,
              dyRaw = wey - wsy,
              distRaw = sqrt(dxRaw * dxRaw + dyRaw * dyRaw),
              eff = min(distRaw, MAX_THROW_DISTANCE),
              speed = (eff / MAX_THROW_DISTANCE) * MAX_THROW_SPEED,
              angle = atan2(dyRaw, dxRaw),
              dx = cos(angle) * speed,
              dy = sin(angle) * speed;
            noggles.push({ x: wsx, y: wsy, vx: dx, vy: dy, r: 10, angle: 0, angularVelocity: random(-0.2, 0.2) });
          }
          return false;
        } else {
          initializeGame();
          gameState = "playing";
          return false;
        }
      }
    </script>
  </body>
