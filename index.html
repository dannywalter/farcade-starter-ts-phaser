<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ensure mobile viewport sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Platformer Game</title>
    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <!-- Farcade SDK (if you need it) -->
    <script src="https://cdn.jsdelivr.net/npm/@farcade/game-sdk@latest/dist/index.min.js"></script>
    <style>
      /* full‐screen flex container, but capped at 500×800 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #333;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* wrapper that limits our p5 canvas to max 500×800 */
      .game-container {
        width: 100vw;
        height: 100vh;
        max-width: 500px;
        max-height: 800px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      /* let the canvas stretch to fill that container */
      .game-container canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="game-container" id="game-container"></div>

    <script>
      // --- Sprite Sheet Configuration ---
      const SPRITE_URL =
        "https://lqy3lriiybxcejon.public.blob.vercel-storage.com/u0NamAsZmpLH/myNounsSpritesheet-OU77yPsOSF8J2NLPWWWFPVya9XMAQS.png";
      const FRAME_WIDTH = 48;
      const FRAME_HEIGHT = 48;

      // --- Player Configuration ---
      let player;
      const PLAYER_MOVE_SPEED = 4;
      const JUMP_FORCE = -11;
      const GRAVITY = 0.5;
      const PLAYER_VISUAL_SCALE = 1.5;

      // --- Animation Definitions (Frames & Speed) ---
      const ANIMATION_DEFINITIONS = {
        idle: { frames: 16, speed: 8 },
        walk: { frames: 8, speed: 6 },
        jump: { frames: 8, speed: 7 },
        fall: { frames: 8, speed: 7 },
      };

      // --- Animation Row & Start Frame Mapping ---
      const ANIMATION_ROW_MAP = {
        idle: { right: { row: 4, startFrame: 0 }, left: { row: 6, startFrame: 0 } },
        walk: { right: { row: 0, startFrame: 0 }, left: { row: 2, startFrame: 0 } },
        jump: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
        fall: { right: { row: 0, startFrame: 8 }, left: { row: 2, startFrame: 8 } },
      };

      let nounSpriteSheet,
        imageLoadingError = false;
      let platforms = [],
        goal,
        levelWidth,
        cameraX = 0,
        gameState;

      function preload() {
        nounSpriteSheet = loadImage(
          SPRITE_URL,
          () => console.log("Sprite sheet loaded"),
          () => {
            console.error("Sprite load failed");
            imageLoadingError = true;
          },
        );
      }

      function setup() {
        // internal coordinate system stays 500×800
        const cnv = createCanvas(500, 800);
        // remove the p5-added inline sizing:
        cnv.elt.removeAttribute("style");
        // put it inside our wrapper
        cnv.parent("game-container");
        colorMode(HSB, 360, 100, 100, 100);
        textAlign(CENTER, CENTER);
        imageMode(CENTER);
        initializeGame();
      }

      function initializeGame() {
        player = {
          x: 100,
          y: height - 100,
          width: FRAME_WIDTH,
          height: FRAME_HEIGHT,
          velocityX: 0,
          velocityY: 0,
          isOnGround: false,
          spriteSheet: nounSpriteSheet,
          animation: { currentSet: "idle", facingDirection: 1, frameIndex: 0, tick: 0 },
        };

        platforms = [
          { x: 0, y: height - 50, width: 400, height: 50, color: color(120, 60, 60) },
          { x: 450, y: height - 120, width: 150, height: 20, color: color(120, 60, 70) },
          { x: 650, y: height - 220, width: 200, height: 20, color: color(120, 60, 70) },
          { x: 400, y: height - 320, width: 100, height: 20, color: color(120, 60, 70) },
          { x: 900, y: height - 100, width: 250, height: 100, color: color(120, 60, 65) },
          { x: 1200, y: height - 250, width: 180, height: 20, color: color(120, 60, 70) },
          { x: 1450, y: height - 350, width: 150, height: 20, color: color(120, 60, 70) },
          { x: 1700, y: height - 150, width: 300, height: 150, color: color(120, 60, 60) },
        ];

        goal = { x: 2050, y: height - 100, width: 50, height: 50, color: color(50, 100, 100) };
        platforms.push({
          x: goal.x - 25,
          y: goal.y + goal.height - 20,
          width: 100,
          height: 20,
          color: color(120, 60, 60),
        });

        levelWidth = Math.max(...platforms.map((p) => p.x + p.width), goal.x + goal.width) + 200;
        cameraX = 0;
        gameState = "start";
      }

      function draw() {
        background(195, 70, 40);
        if (imageLoadingError && gameState !== "gameOver") {
          fill(0, 0, 100);
          textSize(18);
          text("Error loading spritesheet.\nCheck console and refresh.", width / 2, height / 2);
          return;
        }

        if (gameState === "start") displayStartScreen();
        else if (gameState === "playing") runGame();
        else {
          drawGameScene();
          if (gameState === "gameOver") displayGameOverScreen();
          else displayWinScreen();
        }
      }

      function displayStartScreen() {
        fill(0, 0, 100);
        textSize(32);
        text("Noun Platformer Deluxe!", width / 2, height / 3);
        textSize(22);
        text("A/D or ←→: Move", width / 2, height / 2 - 30);
        text("W/↑/Space or Tap: Jump", width / 2, height / 2 + 10);
        textSize(26);
        text("Tap or Press Space to Start", width / 2, height / 2 + 70);
      }

      function displayGameOverScreen() {
        fill(0, 0, 0, 60);
        rect(0, 0, width, height);
        fill(0, 100, 100);
        textSize(54);
        text("Game Over", width / 2, height / 3);
        textSize(30);
        text("Tap/Press Space to Restart", width / 2, height / 2 + 40);
      }

      function displayWinScreen() {
        fill(120, 80, 100, 60);
        rect(0, 0, width, height);
        fill(120, 100, 100);
        textSize(60);
        text("You Win!", width / 2, height / 3);
        textSize(30);
        text("Tap/Press Space to Play Again", width / 2, height / 2 + 40);
      }

      function runGame() {
        handlePlayerInput();
        updatePlayer();
        updatePlayerAnimationState();
        advancePlayerFrame();
        updateCamera();
        drawGameScene();
        checkGoal();
        checkFallen();
      }

      function drawGameScene() {
        push();
        translate(-cameraX, 0);
        drawPlatforms();
        drawGoal();
        drawPlayer();
        pop();
      }

      function handlePlayerInput() {
        player.velocityX = 0;
        if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) {
          player.velocityX = -PLAYER_MOVE_SPEED;
          player.animation.facingDirection = -1;
        }
        if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) {
          player.velocityX = PLAYER_MOVE_SPEED;
          player.animation.facingDirection = 1;
        }
      }

      function playerJump() {
        if (player.isOnGround) {
          player.velocityY = JUMP_FORCE;
          player.isOnGround = false;
        }
      }

      function updatePlayerAnimationState() {
        let anim = player.animation,
          set = anim.currentSet;
        if (player.velocityY < -0.1 && !player.isOnGround) set = "jump";
        else if (player.velocityY > 0.1 && !player.isOnGround) set = "fall";
        else if (player.isOnGround) set = abs(player.velocityX) > 0.1 ? "walk" : "idle";
        if (set !== anim.currentSet) {
          anim.currentSet = set;
          anim.frameIndex = 0;
          anim.tick = 0;
        }
      }

      function advancePlayerFrame() {
        let anim = player.animation,
          def = ANIMATION_DEFINITIONS[anim.currentSet];
        if (!def) return;
        anim.tick++;
        if (anim.tick >= def.speed) {
          anim.tick = 0;
          anim.frameIndex = (anim.frameIndex + 1) % def.frames;
        }
      }

      function updatePlayer() {
        player.x += player.velocityX;
        // horizontal collisions
        for (let p of platforms) {
          if (isColliding(player, p)) {
            if (player.velocityX > 0) player.x = p.x - player.width / 2;
            else player.x = p.x + p.width + player.width / 2;
            player.velocityX = 0;
          }
        }
        // vertical
        player.velocityY += GRAVITY;
        player.y += player.velocityY;
        player.isOnGround = false;
        for (let p of platforms) {
          if (isColliding(player, p)) {
            let prevBottom = player.y - player.velocityY + player.height / 2,
              topY = p.y;
            if (player.velocityY > 0 && prevBottom <= topY + 1) {
              player.y = p.y - player.height / 2;
              player.velocityY = 0;
              player.isOnGround = true;
            } else if (player.velocityY < 0) {
              let prevTop = player.y - player.velocityY - player.height / 2,
                botY = p.y + p.height;
              if (prevTop >= botY - 1) {
                player.y = botY + player.height / 2;
                player.velocityY = 0;
              }
            }
          }
        }
        // world bounds
        player.x = constrain(player.x, player.width / 2, levelWidth - player.width / 2);
      }

      function drawPlayer() {
        if (!player.spriteSheet || imageLoadingError) {
          push();
          rectMode(CENTER);
          fill(255, 0, 0);
          rect(player.x, player.y, player.width, player.height);
          pop();
          return;
        }
        let anim = player.animation,
          mapEntry = ANIMATION_ROW_MAP[anim.currentSet][anim.facingDirection === 1 ? "right" : "left"],
          frame = anim.frameIndex % ANIMATION_DEFINITIONS[anim.currentSet].frames,
          sx = (mapEntry.startFrame + frame) * FRAME_WIDTH,
          sy = mapEntry.row * FRAME_HEIGHT,
          dw = FRAME_WIDTH * PLAYER_VISUAL_SCALE,
          dh = FRAME_HEIGHT * PLAYER_VISUAL_SCALE,
          yOff = (dh - player.height) / 2,
          drawY = player.y - yOff;

        push();
        image(player.spriteSheet, player.x, drawY, dw, dh, sx, sy, FRAME_WIDTH, FRAME_HEIGHT);
        pop();
      }

      function drawPlatforms() {
        rectMode(CORNER);
        for (let p of platforms) {
          fill(p.color);
          stroke(0, 0, 0, 30);
          strokeWeight(2);
          rect(p.x, p.y, p.width, p.height);
        }
        noStroke();
      }

      function drawGoal() {
        rectMode(CORNER);
        fill(goal.color);
        rect(goal.x, goal.y, goal.width, goal.height);
      }

      function isColliding(a, b) {
        let l1 = a.x - a.width / 2,
          r1 = a.x + a.width / 2,
          t1 = a.y - a.height / 2,
          bot1 = a.y + a.height / 2;
        let l2 = b.x,
          r2 = b.x + b.width,
          t2 = b.y,
          bot2 = b.y + b.height;
        return r1 > l2 && l1 < r2 && bot1 > t2 && t1 < bot2;
      }

      function updateCamera() {
        let target = player.x - width / 3;
        cameraX = lerp(cameraX, target, 0.1);
        cameraX = constrain(cameraX, 0, max(levelWidth - width, 0));
      }

      function checkFallen() {
        if (player.y - player.height / 2 > height + player.height) gameState = "gameOver";
      }
      function checkGoal() {
        if (isColliding(player, goal)) gameState = "win";
      }

      function keyPressed() {
        if (gameState === "playing") {
          if ([UP_ARROW, 87, 32].includes(keyCode)) playerJump();
        } else if (keyCode === 32) {
          initializeGame();
          gameState = "playing";
        }
      }

      function mousePressed() {
        if (gameState === "playing") playerJump();
        else {
          initializeGame();
          gameState = "playing";
        }
      }

      function touchStarted() {
        // mirror mousePressed logic:
        if (gameState === "playing") {
          playerJump();
        } else {
          initializeGame();
          gameState = "playing";
        }
        // prevent browser from also doing its default touch behavior
        return false;
      }
    </script>
  </body>
</html>
